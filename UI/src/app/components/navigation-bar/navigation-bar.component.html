@if (showNavbar()) {
<nav class="navbar navbar-expand-sm gradient-custom">
  <div class="container-fluid">
    <div class="nav-link-brand">
      <img
        id="navbarBrand"
        class="hoverBrand"
        src="/assets/DanFrunzaLogo_Mini.png"
        alt="Logo"
      />
    </div>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNavAltMarkup"
      aria-controls="navbarNavAltMarkup"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div
      class="collapse navbar-collapse justify-content-between"
      id="navbarNavAltMarkup"
    >
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="customers"
            ><span class="hoveritem">Customers</span></a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="auditLog"
            ><span class="hoveritem">Audit Log</span></a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="about"
            ><span class="hoveritem">About</span></a
          >
        </li>
      </ul>
      <a
        class="nav-link"
        aria-current="page"
        role="button"
        style="cursor: pointer"
        (click)="logout()"
        ><span class="hoveritem">Log out</span></a
      >
    </div>
  </div>
</nav>
}
