@if (showNavbar()) {
<nav class="navbar navbar-expand-sm navbar-dark gradient-custom">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="customers" aria-label="Customers">
      <img
        id="navbarBrand"
        class="hoverBrand"
        src="/assets/DanFrunzaLogo_Mini.png"
        alt="Logo"
      />
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNavAltMarkup"
      aria-controls="navbarNavAltMarkup"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div
      class="collapse navbar-collapse justify-content-between"
      id="navbarNavAltMarkup"
    >
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="customers" routerLinkActive="active"
            >Customers</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="auditLog" routerLinkActive="active"
            >Audit Log</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="about" routerLinkActive="active"
            >About</a
          >
        </li>
      </ul>
      <a class="nav-link nav-logout" role="button" (click)="logout()"
        >Log out</a
      >
    </div>
  </div>
</nav>
}
