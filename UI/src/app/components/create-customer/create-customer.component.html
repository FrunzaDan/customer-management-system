<form [formRoot]="customerForm">
  <div class="page">
    <div class="page-header">
      <div>
        <h1 class="page-title">Register customer</h1>
        <p class="page-subtitle">Enter the customer's personal details and address.</p>
      </div>
    </div>

    @if (invalidSummary(); as summary) {
    <div class="alert alert-danger" role="alert">{{ summary }}</div>
    }

    <app-customer-form-fields [form]="customerForm" />

    <div class="form-actions mt-4">
      <button type="submit" class="btn btn-primary" [disabled]="customerForm().submitting()">
        @if (customerForm().submitting()) {
        <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
        } Add Customer
      </button>
      <a routerLink="/customers" class="btn btn-link">Cancel</a>
    </div>

    @if (errorMessage(); as error) {
    <div class="alert alert-danger mt-3" role="alert">{{ error }}</div>
    }
  </div>
</form>
