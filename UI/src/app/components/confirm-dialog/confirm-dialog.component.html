@if (visible()) {
<div class="confirm-overlay" [class.closing]="closing()" (click)="respond(false)">
  <div
    #dialog
    class="confirm-card"
    [class.closing]="closing()"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    aria-describedby="confirm-message"
    (click)="$event.stopPropagation()"
    (keydown)="trapFocus($event)"
  >
    <h2 id="confirm-title" class="confirm-title">{{ title() }}</h2>
    <p id="confirm-message" class="confirm-message">{{ message() }}</p>
    <div class="confirm-actions">
      <button #cancelButton type="button" class="btn btn-secondary" (click)="respond(false)">
        {{ cancelLabel() }}
      </button>
      <button type="button" class="btn btn-danger" (click)="respond(true)">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
}
