<form [formRoot]="customerForm">
  <div class="page">
    <div class="page-header">
      <div>
        <h1 class="page-title">Edit customer</h1>
        <p class="page-subtitle">Update the customer's details and address.</p>
      </div>
    </div>

    @if (isLoading()) {
      <div class="app-card loading-state mb-4" role="status">
        <span
          class="spinner-border spinner-border-sm me-2"
          aria-hidden="true"
        ></span
        >Loading customer…
      </div>
    }
    @if (errorMessage() && !isLoading()) {
      <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
    }
    @if (invalidSummary(); as summary) {
      <div class="alert alert-danger" role="alert">{{ summary }}</div>
    }

    <app-customer-form-fields [form]="customerForm" />

    <div class="form-actions mt-4">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="customerForm().submitting()"
      >
        @if (customerForm().submitting()) {
          <span
            class="spinner-border spinner-border-sm me-1"
            aria-hidden="true"
          ></span>
        }
        Save changes
      </button>
      <a routerLink="/customers" class="btn btn-link">Cancel</a>
    </div>

    @if (saveError(); as error) {
      <div class="alert alert-danger mt-3" role="alert">{{ error }}</div>
    }
  </div>
</form>
